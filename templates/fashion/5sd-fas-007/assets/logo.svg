      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="textGrad-5sd-fas-007" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow-5sd-fas-007" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#047857" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Emblem Mark Badge -->
  <g filter="url(#glow-5sd-fas-007)">
