<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logoGrad-5sd-agr-006" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="textGrad-5sd-agr-006" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow-5sd-agr-006" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#15803D" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Emblem Mark Badge -->
  <g filter="url(#glow-5sd-agr-006)">
    <rect x="4" y="8" width="48" height="48" rx="14" fill="url(#logoGrad-5sd-agr-006)" />
    <rect x="5.5" y="9.5" width="45" height="45" rx="12.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />
    <!-- Embedded Industry Symbol -->
    <g transform="translate(16, 14) scale(1.0)" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M12 2L4 7v10l8 5 8-5V7l-8-5zm0 2.8L18 8.5 12 12 6 8.5 12 4.8zm-1 8.7V19l-5-3.1v-5.4l5 3zm2 0l5-3v5.4l-5 3.1v-5.5z" />
    </g>
    <!-- Monogram Initial Pill -->
    <circle cx="44" cy="48" r="9" fill="#0f172a" stroke="#CA8A04" stroke-width="1.5" />
    <text x="44" y="51.5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="8.5" fill="#ffffff" letter-spacing="0.02em">
      CH
    </text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(64, 0)">
    <text x="0" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="20" fill="url(#textGrad-5sd-agr-006)" letter-spacing="0.03em">
