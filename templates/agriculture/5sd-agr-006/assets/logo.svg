    </text>
    
    <!-- Sub-niche category pill -->
    <rect x="0" y="40" width="180" height="15" rx="4" fill="#15803D22" stroke="#15803D55" stroke-width="0.8" />
    <text x="6" y="51" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="8" fill="#15803D" letter-spacing="0.08em">
      HYDROPONIC VERTICAL FARMING
    </text>
